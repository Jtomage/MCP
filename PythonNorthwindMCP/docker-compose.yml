services:
  # MCP
  northwind-pymcp:
    build: 
      context: ./PythonMCP
    restart: unless-stopped
    ports:
      - 7071:7071
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 7071
      ConnectionString: SERVER=northwinddb,1433;DATABASE=Northwind;UID=sa;PWD=Password1;TrustServerCertificate=yes;
    
  # database
  northwinddb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql-northwind
    restart: unless-stopped
    environment:
      MSSQL_SA_PASSWORD: "Password1"
      ACCEPT_EULA: "Y"
    ports: 
      - 1433:1433
    volumes: 
      - ./NorthwindDB:/NorthwindDB
    entrypoint: ["/bin/bash", "/NorthwindDB/init-db.sh"]

  #AI
  kobolcpp-northwind: 
    image: koboldai/koboldcpp:latest
    restart: unless-stopped
    ports: 
      - 7072:5001
    environment:
      KCPP_ARGS: >
        --model https://huggingface.co/unsloth/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_S.gguf?download=true 
        --threads 8 --gpulayers 0 --contextsize 8192 --host 0.0.0.0